[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spinanalyzer"
version = "2.0.0"
description = "SpinAnalyzer v2 — villain pattern search engine for HU/Spin&Go poker"
requires-python = ">=3.10"
readme = "README_V2.md"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "polars>=0.20",
    "duckdb>=0.10",
    "pyarrow>=15",
    "pandas>=2.1",
    "numpy>=1.26,<2.0",
    "faiss-cpu>=1.8",
    "pokerkit>=0.5",
    "treys>=0.1.8",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "lxml>=5.1",
    "beautifulsoup4>=4.12",
    "tomli>=2.0",
    "tomli-w>=1.0",
    "loguru>=0.7",
    "python-multipart>=0.0.9",
    "arq>=0.25",
    "redis>=5.0",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "hypothesis>=6.98",
    "schemathesis>=3.25",
    "syrupy>=4",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "ruff>=0.3",
    "mypy>=1.9",
    "pre-commit>=3.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"
markers = [
    "integration: integration tests (may require external services)",
    "slow: slow tests",
]
filterwarnings = [
    # pokerkit emits "card not recommended" warnings when our placeholder
    # hole-card selection coincidentally picks a future board card. The
    # adapter compensates but pokerkit warns from inside its verifier.
    "ignore:A card being dealt.*is not recommended.*:UserWarning:pokerkit",
]
