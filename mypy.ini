[mypy]
python_version = 3.10
strict = True
ignore_missing_imports = True
plugins = pydantic.mypy
exclude = (^src/api/legacy/|^frontend/|^dataset/legacy/|^src/context/context_extractor\.py$|^src/vectorization/vectorizer\.py$|^src/services/index_builder\.py$|^src/parsers/unified_parser\.py$|^src/indexing/build_indices\.py$)

[mypy-tests.*]
disallow_untyped_decorators = False
disallow_untyped_defs = False
