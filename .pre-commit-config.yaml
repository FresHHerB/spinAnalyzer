repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.6, types-redis]
        files: ^src/(?!api/legacy/|context/context_extractor\.py$|vectorization/vectorizer\.py$|services/index_builder\.py$|parsers/unified_parser\.py$|indexing/build_indices\.py$)
